<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Strike &middot; Live</title>
<style>
  :root {
    --green: #0B2A1C; --green2: #12382A; --cream: #F4F1E6; --bone: #FBF9F3;
    --gold: #C9A227; --gold2: #E6CD72; --ink: #1B1D1A; --mid: #5E6B63; --hair: #E3DCC8;
    --brick: #C23B33; --under: #2E7D4F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bone); color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  header { background: var(--green); color: var(--cream); padding: calc(env(safe-area-inset-top) + 18px) 18px 18px; }
  .brand { display: flex; justify-content: space-between; align-items: center;
    font-family: Georgia, serif; letter-spacing: .3em; font-size: 12px; font-weight: bold; }
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--gold2); letter-spacing: .2em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #E8615A; animation: pulse 1.6s infinite; }
  .dot.final { background: var(--mid); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  h1 { font-size: 26px; margin: 14px 0 4px; font-weight: 800; letter-spacing: -.01em; }
  .sub { color: #C8CFC5; font-size: 14px; }
  main { padding: 16px; max-width: 760px; margin: 0 auto; }
  .status { background: var(--cream); border: 1px solid var(--hair); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .status .big { font-size: 26px; font-weight: 900; letter-spacing: .01em; }
  .status .thru { font-family: Georgia, serif; letter-spacing: .18em; font-size: 12px; color: var(--mid); margin-top: 4px; }
  .lines { margin-top: 10px; display: grid; gap: 6px; }
  .lines div { font-size: 15px; font-weight: 600; padding-top: 6px; border-top: 1px solid var(--hair); }
  .totals { margin-top: 12px; display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; font-variant-numeric: tabular-nums; }
  .totals span { font-size: 15px; } .totals .n { font-weight: 700; } .totals .g { text-align: right; font-weight: 800; }
  .totals .p { text-align: right; font-weight: 800; min-width: 34px; }
  .card { background: #fff; border: 1px solid var(--hair); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
  .card h2 { font-family: Georgia, serif; font-weight: normal; letter-spacing: .2em; font-size: 11px; color: var(--mid);
    margin: 0; padding: 12px 14px 8px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; width: max-content; min-width: 100%; }
  th, td { text-align: center; padding: 7px 0; min-width: 32px; font-size: 14px; border-bottom: 1px solid #EFEADB; }
  th.name, td.name { text-align: left; padding-left: 14px; padding-right: 10px; position: sticky; left: 0; background: #fff;
    min-width: 92px; max-width: 120px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }
  td.name small { display: block; font-weight: 500; color: var(--mid); font-size: 11px; }
  thead th { background: var(--green); color: var(--cream); font-weight: 700; }
  thead th.name { background: var(--green); color: var(--gold2); font-family: Georgia, serif; font-weight: normal; letter-spacing: .12em; font-size: 11px; }
  tr.par td { color: var(--mid); font-size: 12px; }
  td.tot { font-weight: 800; background: #F7F4EA; min-width: 44px; }
  td.topar { font-weight: 800; min-width: 44px; padding-right: 12px; }
  .s { display: inline-block; min-width: 24px; height: 24px; line-height: 24px; font-weight: 700; }
  .birdie { border: 1.6px solid var(--under); border-radius: 50%; color: var(--under); }
  .eagle { border: 1.6px solid var(--gold); border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 0 0 3.6px var(--gold); }
  .bogey { border: 1.4px solid rgba(194,59,51,.6); color: var(--brick); }
  .dbl { border: 1.4px solid var(--brick); color: var(--brick); box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.4px var(--brick); }
  .pu { color: var(--brick); font-size: 11px; font-weight: 800; }
  .under { color: var(--under); } .over { color: var(--brick); }
  .game .ghead { padding: 0 14px; font-size: 20px; font-weight: 900; }
  .game .gnote { padding: 2px 14px 10px; font-size: 12px; color: var(--mid); }
  .plist { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; padding: 0 14px 12px;
    font-variant-numeric: tabular-nums; align-items: baseline; }
  .plist .n { font-weight: 700; font-size: 15px; }
  .plist .ph { font-size: 12px; color: var(--mid); text-align: right; letter-spacing: .04em; }
  .plist .ph b { color: var(--ink); font-size: 15px; }
  .plist .sc { font-weight: 800; text-align: right; min-width: 56px; }
  .shots td { color: var(--gold); font-size: 13px; letter-spacing: -1px; }
  .shots tr.si td { color: var(--mid); font-size: 11px; letter-spacing: 0; }
  .shots td.tot, .shots td.name { color: var(--ink); letter-spacing: 0; }
  .sublabel { font-family: Georgia, serif; letter-spacing: .2em; font-size: 10px; color: var(--mid); padding: 4px 14px 6px; }
  .meta { text-align: center; color: var(--mid); font-size: 12px; margin: 10px 0 30px; }
  .msg { background: var(--cream); border: 1px solid var(--hair); border-radius: 16px; padding: 22px; text-align: center; color: var(--mid); }
  .msg b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
  footer { text-align: center; font-family: Georgia, serif; letter-spacing: .3em; font-size: 11px; color: var(--mid); padding-bottom: 30px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span>STRIKE</span><span class="live"><span class="dot" id="dot"></span><span id="liveword">LIVE</span></span></div>
  <h1 id="title">Loading&hellip;</h1>
  <div class="sub" id="sub">&nbsp;</div>
</header>
<main id="main"></main>
<div class="meta" id="meta"></div>
<footer>STRIKE &middot; DRIVEN BY DATA</footer>
<script>
// ---- config -------------------------------------------------------------
// Read-only CloudKit web token for the public database (CloudKit Console ->
// Tokens & Keys -> API Tokens). It can only read public records; the game
// code in the link is what keeps a game private.
// Tokens are per CloudKit environment: Development = Xcode/devicectl
// installs, Production = TestFlight / App Store installs.
const API_TOKENS = {
  development: "17cb0926f94e0708a8a312b86057b29aeee1f570c9556b029f6356866bcbfcd4",
  production: ""   // add when the Production token exists
};
const CONTAINER = "iCloud.DVH-Ventures.Strikeapp71.v2";
const REFRESH_MS = 15000;
// --------------------------------------------------------------------------

const qs = new URLSearchParams(location.search);
const code = (qs.get("g") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 32);
const env = qs.get("e") === "p" ? "production" : "development";
const $ = id => document.getElementById(id);
let lastUpdated = 0, failures = 0;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function fetchGame() {
  const url = `https://api.apple-cloudkit.com/database/1/${CONTAINER}/${env}/public/records/lookup?ckAPIToken=${encodeURIComponent(API_TOKENS[env] || "")}`;
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ records: [{ recordName: code }] }) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const body = await res.json();
  const rec = (body.records || [])[0];
  if (!rec || rec.serverErrorCode) return null;          // not found / stopped
  const raw = rec.fields && rec.fields.payload && rec.fields.payload.value;
  return raw ? JSON.parse(raw) : null;
}

function cls(score, par) {
  if (score == null || par == null) return "";
  const d = score - par;
  return d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 0 ? "" : d === 1 ? "bogey" : "dbl";
}

function render(g) {
  document.title = `${g.title} \u00B7 Strike Live`;
  $("title").textContent = g.title;
  $("sub").textContent = [g.course, g.tee && `${g.tee} tees`, g.date, g.format].filter(Boolean).join(" \u00B7 ");
  $("dot").className = "dot" + (g.finished ? " final" : "");
  $("liveword").textContent = g.finished ? "FINAL" : "LIVE";

  const lines = (g.lines || []).map(l => `<div>${esc(l)}</div>`).join("");
  const totals = g.rows.map(r => {
    const tp = r.toPar || "";
    const c = tp.startsWith("-") ? "under" : (tp.startsWith("+") ? "over" : "");
    return `<span class="n">${esc(r.name)}</span><span class="g">${esc(r.total)}</span><span class="p ${c}">${esc(tp)}</span>`;
  }).join("");
  const head = `<tr><th class="name">HOLE</th>${g.holes.map(h => `<th>${h.n}</th>`).join("")}<th>TOT</th><th>+/&minus;</th></tr>`;
  const par = `<tr class="par"><td class="name">Par</td>${g.holes.map(h => `<td>${h.par ?? ""}</td>`).join("")}<td class="tot"></td><td></td></tr>`;
  const rows = g.rows.map(r => {
    const cells = g.holes.map((h, i) => {
      if (r.pickups && r.pickups[i]) return `<td><span class="pu">PU</span></td>`;
      const s = r.scores[i];
      return `<td>${s == null ? "" : `<span class="s ${cls(s, h.par)}">${s}</span>`}</td>`;
    }).join("");
    const tp = r.toPar || "";
    const tpc = tp.startsWith("-") ? "under" : (tp.startsWith("+") ? "over" : "");
    return `<tr><td class="name">${esc(r.name)}${r.sub ? `<small>${esc(r.sub)}</small>` : ""}</td>${cells}<td class="tot">${esc(r.total)}</td><td class="topar ${tpc}">${esc(tp)}</td></tr>`;
  }).join("");

  $("main").innerHTML = `
    <section class="status"><div class="big">${esc(g.status)}</div><div class="thru">${esc(g.thru)}</div>
      ${lines ? `<div class="lines">${lines}</div>` : ""}
      ${totals ? `<div class="totals">${totals}</div>` : ""}</section>
    ${(g.games || []).map(x => gameCard(x, g.holes)).join("")}
    <section class="card"><h2>SCORECARD &middot; IN THE ORDER PLAYED</h2>
      <div class="scroll"><table><thead>${head}</thead><tbody>${par}${rows}</tbody></table></div></section>`;
  lastUpdated = (g.updated || 0) * 1000;
  tickMeta();
}

function gameCard(g, holes) {
  const players = g.players || [];
  const plist = players.map(p => `<span class="n">${esc(p.name)}</span>` +
    `<span class="ph">PLAYS <b>${p.plays}</b></span><span class="sc">${esc(p.score)}</span>`).join("");
  const anyShots = players.some(p => (p.shots || []).some(x => x > 0));
  let grid = "";
  if (anyShots) {
    const dots = n => n <= 0 ? "" : (n === 1 ? "\u25CF" : n === 2 ? "\u25CF\u25CF" : n + "\u25CF");
    const head = `<tr><th class="name">HOLE</th>${holes.map(h => `<th>${h.n}</th>`).join("")}<th>TOT</th></tr>`;
    const si = `<tr class="si"><td class="name">Stroke index</td>${holes.map(h => `<td>${h.si ?? ""}</td>`).join("")}<td class="tot"></td></tr>`;
    const rows = players.map(p => {
      const sh = p.shots || [];
      const tot = sh.reduce((a, b) => a + (b || 0), 0);
      return `<tr><td class="name">${esc(p.name)}</td>${holes.map((h, i) => `<td>${dots(sh[i] || 0)}</td>`).join("")}<td class="tot">${tot}</td></tr>`;
    }).join("");
    grid = `<div class="sublabel">SHOTS RECEIVED &middot; IN THE ORDER PLAYED</div>
      <div class="scroll shots"><table><thead>${head}</thead><tbody>${si}${rows}</tbody></table></div>`;
  }
  return `<section class="card game"><h2>${esc(g.name)}</h2>
    <div class="ghead">${esc(g.headline)}</div><div class="gnote">${esc(g.note)}</div>
    <div class="plist">${plist}</div>${grid}</section>`;
}

function tickMeta() {
  if (!lastUpdated) return;
  const s = Math.max(0, Math.round((Date.now() - lastUpdated) / 1000));
  const ago = s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`;
  $("meta").textContent = `Last score update ${ago} \u00B7 refreshes every 15 seconds`;
}

function message(title, body) {
  $("main").innerHTML = `<div class="msg"><b>${esc(title)}</b>${esc(body)}</div>`;
}

async function refresh() {
  if (document.hidden) return;
  try {
    const g = await fetchGame();
    failures = 0;
    if (!g) {
      $("title").textContent = "Strike Live";
      message("This game isn't live", "It may not have started yet, or the host has stopped sharing it.");
      return;
    }
    render(g);
  } catch (e) {
    failures += 1;
    if (!lastUpdated) message("Can't reach the scores right now", "Check your signal \u2014 this page keeps trying.");
    $("meta").textContent = "Reconnecting\u2026";
  }
}

if (!code) {
  $("title").textContent = "Strike Live";
  message("No game in this link", "Ask the host to send the live link again.");
} else {
  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(tickMeta, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}
</script>
</body>
</html>
